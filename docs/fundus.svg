    <text x="124" y="26" font-size="13.5" fill="#c9ccd6">Kampagne</text>
    <text x="214" y="26" font-size="13.5" fill="#c9ccd6">Ideen</text>
    <rect x="270" y="12" width="22" height="20" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <text x="281" y="26" font-size="14" font-weight="700" fill="#c9ccd6" text-anchor="middle">+</text>
  </g>


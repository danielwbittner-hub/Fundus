  <!-- Mini-Karte (unten rechts) -->
  <g transform="translate(1376,788)">
    <rect width="200" height="150" rx="13" fill="#121726" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="14" y="12" width="14" height="11" rx="2" fill="none" stroke="#8a6bff" stroke-width="1.3"/>
    <text x="34" y="22" font-size="11" font-weight="700" fill="#c9ccd6">Übersicht</text>
    <rect x="12" y="32" width="176" height="104" rx="7" fill="#000000" fill-opacity="0.35"/>
    <g>
      <rect x="40" y="48" width="18" height="22" rx="2" fill="#7486ff"/>
      <rect x="66" y="52" width="24" height="16" rx="2" fill="#2ee6f0" opacity="0.8"/>
      <rect x="100" y="46" width="40" height="30" rx="2" fill="#8a6bff" opacity="0.55"/>
      <rect x="54" y="92" width="20" height="14" rx="2" fill="#ffbd3d" opacity="0.8"/>
      <rect x="88" y="96" width="26" height="12" rx="2" fill="#4cd985" opacity="0.7"/>
      <rect x="30" y="40" width="120" height="76" rx="3" fill="none" stroke="#2ee6f0" stroke-width="1.5"/>
    </g>

      <text x="14" y="70">🖼 titel_final.tif</text>
      <text x="14" y="88">🖼 banner_web.png</text>
    </g>
    <text x="14" y="110" font-size="9.5" fill="#9aa0b0">18 Objekte · Finder-Ordner</text>
  </g>

  <!-- ================= Schwebende Bedienung ================= -->

  <!-- Reiter -->
  <g transform="translate(24,22)">

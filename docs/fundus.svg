  </g>

  <!-- Karte: Website-Link (frei) -->
  <g transform="translate(120,250)">
    <rect width="212" height="96" rx="12" fill="#141b2a"/>
    <rect width="212" height="96" rx="12" fill="url(#linkbg)"/>
    <rect width="212" height="96" rx="12" fill="none" stroke="#2ee6f0" stroke-opacity="0.35"/>
    <circle cx="22" cy="24" r="7" fill="none" stroke="#2ee6f0" stroke-width="1.4"/>
    <path d="M15 24 h14 M22 17 v14 M17 20 q5 4 10 0 M17 28 q5 -4 10 0" stroke="#2ee6f0" stroke-width="1" fill="none"/>
    <text x="38" y="28" font-size="11" fill="#9aa0b0">modehaus-beispiel.de</text>
    <text x="18" y="56" font-size="13.5" font-weight="700" fill="#e8eaf0">Winteraktion &#8211; Landingpage</text>
    <text x="18" y="78" font-size="10.5" fill="#9aa0b0">Angebote &amp; Öffnungszeiten prüfen</text>
  </g>


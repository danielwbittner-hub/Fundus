    <rect width="200" height="30" rx="12" fill="#ffbd3d" fill-opacity="0.16"/>
    <rect x="12" y="8" width="16" height="13" rx="2.5" fill="#ffbd3d"/>
    <text x="36" y="20" font-size="12.5" font-weight="700" fill="#e8eaf0">Bildmaterial</text>
    <g font-size="10.5" fill="#c3c8d2">

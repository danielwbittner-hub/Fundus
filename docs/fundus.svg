  <!-- Karte: PDF (frei) -->
  <g transform="translate(300,360)">
    <rect width="170" height="228" rx="12" fill="#1b2130" stroke="#2ee6f0" stroke-opacity="0.9" stroke-width="2"/>
    <rect width="170" height="158" rx="12" fill="#eef1f6"/>
    <rect x="0" y="146" width="170" height="12" fill="#eef1f6"/>
    <rect x="16" y="16" width="138" height="9" rx="2" fill="#2a3340"/>
    <rect x="16" y="34" width="138" height="5" rx="2" fill="#9aa5b4"/>
    <rect x="16" y="45" width="120" height="5" rx="2" fill="#9aa5b4"/>
    <rect x="16" y="56" width="138" height="5" rx="2" fill="#9aa5b4"/>
    <rect x="16" y="74" width="138" height="40" rx="3" fill="#d7dce6"/>
    <rect x="16" y="122" width="100" height="5" rx="2" fill="#9aa5b4"/>
    <g transform="translate(10,168)">
      <path d="M0 2 h11 l3 3 v9 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 z" fill="#8a6bff"/>

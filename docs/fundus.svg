  <!-- Bereichs-Navigation (unten links) -->
  <g transform="translate(24,762)">
    <rect width="194" height="112" rx="14" fill="#121726" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="14" y="14" width="13" height="11" rx="2" fill="none" stroke="#8a6bff" stroke-width="1.4"/>
    <text x="34" y="24" font-size="12" font-weight="700" fill="#c9ccd6">Bereiche</text>
    <text x="172" y="24" font-size="14" font-weight="700" fill="#c9ccd6">+</text>
    <circle cx="24" cy="54" r="5" fill="#8a6bff"/>
    <text x="38" y="58" font-size="12.5" font-weight="600" fill="#ffffff">Konzept</text>
    <circle cx="24" cy="84" r="5" fill="#4cd985"/>
    <text x="38" y="88" font-size="12.5" fill="#c9ccd6">Produktion</text>

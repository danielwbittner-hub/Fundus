<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1221"/>
      <stop offset="0.5" stop-color="#0f1730"/>
      <stop offset="1" stop-color="#0a0d1c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6f0"/>
      <stop offset="0.5" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#e14af0"/>
    </linearGradient>
    <linearGradient id="foto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a24c"/>
      <stop offset="0.5" stop-color="#c76b4a"/>
      <stop offset="1" stop-color="#7a4b8f"/>
    </linearGradient>
    <linearGradient id="linkbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6f0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2ee6f0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="21" cy="21" r="1.5" fill="#8096ff" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- Hintergrund -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- ================= Canvas-Inhalt ================= -->

  <!-- Überschrift (Textfeld) -->
  <text x="556" y="188" font-size="46" font-weight="800" fill="#8fe6ad">Herbst-Kampagne 2026</text>
  <text x="250" y="250" font-size="22" font-weight="700" fill="#b9a9ff">Launch · KW 44</text>

  <!-- Verbindungslinien (hinter den Karten) -->
  <g fill="none" stroke="#2ee6f0" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 420 440 C 520 440, 560 330, 690 330"/>
    <path d="M 905 380 C 760 380, 690 540, 560 540"/>
    <path d="M 420 700 C 560 700, 620 560, 700 560"/>
  </g>
  <g fill="#2ee6f0" opacity="0.92">
    <path d="M 690 330 l -13 -6 l 0 12 z"/>
    <path d="M 560 540 l 13 -6 l 0 12 z"/>
    <path d="M 700 560 l -13 -6 l 0 12 z"/>
  </g>
  <!-- Verbindungs-Beschriftung -->
  <g transform="translate(600,372)">
    <rect x="-34" y="-13" width="68" height="26" rx="13" fill="#121726" stroke="#2ee6f0" stroke-opacity="0.6"/>
    <text x="0" y="4" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">gehört zu</text>
  </g>

  <!-- Mappe „Entwürfe" -->
  <g transform="translate(900,230)">
    <rect x="0" y="0" width="470" height="300" rx="16" fill="#8a6bff" fill-opacity="0.10"
          stroke="#8a6bff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 6"/>
    <path d="M 0 16 Q 0 0 16 0 L 454 0 Q 470 0 470 16 L 470 44 L 0 44 Z" fill="#121726" fill-opacity="0.95"/>
    <path d="M 20 16 l 4 -4 l -8 0 z" fill="#8a6bff"/>
    <rect x="34" y="14" width="16" height="13" rx="2.5" fill="#8a6bff"/>
    <text x="60" y="27" font-size="14" font-weight="700" fill="#ffffff">Entwürfe</text>
    <rect x="130" y="13" width="24" height="18" rx="9" fill="#8a6bff" fill-opacity="0.45"/>
    <text x="142" y="27" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Karte: PDF-Flyer in der Mappe -->
    <g transform="translate(40,70)">
      <rect width="170" height="200" rx="12" fill="#1b2130"/>
      <rect width="170" height="158" rx="12" fill="#eef1f6"/>
      <rect x="0" y="146" width="170" height="12" fill="#eef1f6"/>
      <!-- Mini-Flyer -->
      <rect x="14" y="14" width="142" height="30" fill="#7a1f2a"/>
      <text x="22" y="34" font-size="11" font-weight="800" fill="#ffffff">HERBST&#8211;SALE</text>
      <rect x="14" y="50" width="142" height="62" fill="url(#foto)"/>
      <rect x="14" y="118" width="110" height="7" rx="3" fill="#333a44"/>
      <rect x="14" y="130" width="90" height="6" rx="3" fill="#8891a0"/>

  <g transform="translate(24,78)">
    <rect width="46" height="196" rx="14" fill="#121726" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="none" stroke="#c9ccd6" stroke-width="1.6">
      <rect x="15" y="16" width="16" height="12" rx="2"/>
      <g transform="translate(0,34)"><rect x="15" y="4" width="16" height="12" rx="2"/><line x1="18" y1="8" x2="28" y2="8"/><line x1="18" y1="12" x2="25" y2="12"/></g>
      <circle cx="23" cy="78" r="7"/>
      <g transform="translate(0,22)"><path d="M16 82 h8 l3 3 v7 h-14 v-10 z"/></g>
      <rect x="15" y="130" width="16" height="12" rx="2" stroke-dasharray="3 2"/>
      <path d="M17 166 q6 -8 12 0" transform="translate(0,-2)"/>
    </g>
    <line x1="12" y1="110" x2="34" y2="110" stroke="#ffffff" stroke-opacity="0.12"/>
    <line x1="12" y1="150" x2="34" y2="150" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>

  <!-- Suchleiste -->
  <g transform="translate(1056,22)">
    <rect width="520" height="44" rx="14" fill="#121726" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="22" r="7" fill="none" stroke="#c9ccd6" stroke-width="1.6"/>
    <line x1="31" y1="27" x2="36" y2="32" stroke="#c9ccd6" stroke-width="1.6"/>
    <text x="48" y="27" font-size="13.5" fill="#c9ccd6">Durchsuchen &#8211; Name &amp; Inhalt (PDF, OCR, IDML, Ordner …)</text>
    <line x1="452" y1="13" x2="452" y2="31" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="468" y="27" font-size="12" font-weight="700" fill="#c9ccd6">12 Dok.</text>
  </g>

  <!-- Ansicht-/Zoomleiste -->
  <g transform="translate(1330,78)">
    <rect width="246" height="38" rx="14" fill="#121726" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#c9ccd6">&#8722;</text>
    <text x="40" y="23" font-size="11" font-weight="600" fill="#c9ccd6">100 %</text>
    <text x="84" y="24" font-size="13" font-weight="700" fill="#c9ccd6">+</text>
    <g stroke="#c9ccd6" stroke-width="1.5" fill="none">
      <circle cx="122" cy="19" r="6"/><line x1="122" y1="13" x2="122" y2="19"/>
      <path d="M150 12 a7 7 0 1 0 2 4" />
      <rect x="176" y="13" width="13" height="12" rx="2"/>
      <path d="M205 13 v6 h6 M206 24 a6 6 0 1 0 1 -9" transform="translate(-2,0)"/>
      <rect x="226" y="13" width="12" height="11" rx="2"/>

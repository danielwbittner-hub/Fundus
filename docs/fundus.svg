        <text x="20" y="9" font-size="11.5" font-weight="700" fill="#e8eaf0">Plakat_A3.pdf</text>
        <text x="20" y="24" font-size="9.5" fill="#9aa0b0">2,4 MB</text>
      </g>
    </g>

    <!-- Karte: Bild in der Mappe -->
    <g transform="translate(250,70)">
      <rect width="170" height="200" rx="12" fill="#1b2130"/>
      <rect width="170" height="158" rx="12" fill="#eef1f6"/>
      <rect x="0" y="146" width="170" height="12" fill="#eef1f6"/>
      <rect x="10" y="10" width="150" height="138" rx="4" fill="url(#foto)"/>
      <circle cx="54" cy="52" r="16" fill="#ffe08a" opacity="0.9"/>
      <path d="M18 120 L60 78 L92 104 L120 80 L152 110 L152 148 L18 148 Z" fill="#5a3f36" opacity="0.55"/>
      <g transform="translate(10,168)">
